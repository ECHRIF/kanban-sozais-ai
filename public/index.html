// ─── KPI : Étoiles de notation ───────────────────────────────
function StarRating({ value, onChange, readonly }) {
  const labels = ["", "Insuffisant", "À améliorer", "Satisfaisant", "Bien", "Excellent"];
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
      {[1,2,3,4,5].map(s => (
        <span key={s} onClick={() => !readonly && onChange(s === value ? 0 : s)}
          title={labels[s]}
          style={{ fontSize: 20, cursor: readonly ? "default" : "pointer", color: s <= value ? "#FFB347" : "#334477",
            transition: "color 0.15s", userSelect: "none" }}>★</span>
      ))}
      {value > 0 && <span style={{ color: "#FFB347", fontSize: 11, fontWeight: 700, marginLeft: 4 }}>{labels[value]}</span>}
    </div>
  );
}

// ─── KPI : Modal Évaluation ───────────────────────────────────
function KPIEvalModal({ evaluator, evaluated, criteria, onClose, onSaved, existing }) {
  const isEdit = !!existing;
  const [scores, setScores] = useState(() => existing ? { ...existing.scores } : {});
  const [comment, setComment] = useState(existing?.overall_comment || "");
  const MONTHS_FR=["Jan","F\u00e9v","Mar","Avr","Mai","Jun","Jul","Ao\u00fb","Sep","Oct","Nov","D\u00e9c"];
  const [period, setPeriod] = useState(() => {
    if (existing?.period) return existing.period;
    const d = new Date();
    return d.getFullYear()+"-"+["Jan","F\u00e9v","Mar","Avr","Mai","Jun","Jul","Ao\u00fb","Sep","Oct","Nov","D\u00e9c"][d.getMonth()];
  });
  const [saving, setSaving] = useState(false);
  const [done, setDone] = useState(false);

  const profile = kpiProfileOf(evaluated);
  const activeCriteria = criteria.filter(c => c.active && (c.profile || "ing") === profile);
  const categories = [...new Set(activeCriteria.map(c => c.category))];
  const filled = Object.values(scores).filter(v => v > 0).length;
  const avg = filled ? (Object.values(scores).filter(v=>v>0).reduce((a,b)=>a+b,0)/filled).toFixed(1) : "—";

  const save = async () => {
    setSaving(true);
    if (isEdit) {
      await authFetch(`/api/kpi/evaluations/${existing.id}`, {
        method: "PUT",
        body: JSON.stringify({ scores, overall_comment: comment, period })
      });
    } else {
      await authFetch("/api/kpi/evaluate", {
        method: "POST",
        body: JSON.stringify({ evaluator_name: evaluator.name, evaluated_name: evaluated.name, period, scores, overall_comment: comment })
      });
    }
    setSaving(false); setDone(true);
    setTimeout(() => { onSaved(); onClose(); }, 1500);
  };

  if (done) return (
    <div style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:3000 }}>
      <div style={{ background:DARK2,border:"1px solid "+GREEN,borderRadius:16,padding:40,textAlign:"center" }}>
        <div style={{ fontSize:48,marginBottom:12 }}>✅</div>
        <div style={{ color:GREEN,fontSize:16,fontWeight:700 }}>{isEdit ? "Évaluation modifiée !" : "Évaluation enregistrée !"}</div>
        <div style={{ color:TXT3,fontSize:12,marginTop:6 }}>Moyenne : {avg}/5</div>
      </div>
    </div>
  );

  return (
    <div onClick={onClose} style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:3000 }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:DARK2,border:"1px solid "+BRD,borderRadius:16,padding:28,width:"100%",maxWidth:680,maxHeight:"90vh",overflowY:"auto" }}>
        {/* Header */}
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20 }}>
          <div>
            <h2 style={{ color:TXT,fontSize:18,fontWeight:700,margin:0 }}>{isEdit ? "✏️ Modifier l'évaluation" : "📋 Évaluation KPI"}</h2>
            <div style={{ color:PURPLE,fontSize:13,marginTop:3,fontWeight:600 }}>{evaluated.name} — {evaluated.role}</div>
            <div style={{ color:CYAN,fontSize:11,marginTop:2 }}>Grille : {KPI_PROFILE_LABELS[profile] || profile}</div>
          </div>
          <button onClick={onClose} style={{ background:"none",border:"none",color:TXT3,fontSize:22,cursor:"pointer" }}>✕</button>
        </div>
        {/* Période */}
        <div style={{ display:"flex",gap:10,alignItems:"center",marginBottom:20,padding:"10px 14px",background:DARK3,borderRadius:8 }}>
          <span style={{ color:TXT2,fontSize:12,fontWeight:600 }}>Période :</span>
          {(()=>{
            const MN=["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
            const d=new Date(), yr=d.getFullYear(), mo=d.getMonth();
            const list=[];
            for(let y=2025;y<yr;y++) list.push(String(y));
            for(let m=mo;m<12;m++) list.push(yr+"-"+MN[m]);
            for(let m=0;m<6;m++) list.push((yr+1)+"-"+MN[m]);
            return list.map(p=>(
              <button key={p} onClick={()=>setPeriod(p)} style={{ padding:"4px 10px",background:period===p?PURPLE+"33":DARK2,border:"1px solid "+(period===p?PURPLE:BRD),borderRadius:6,color:period===p?PURPLE:TXT3,fontSize:11,fontWeight:600,cursor:"pointer" }}>{p}</button>
            ));
          })()}
        </div>
        {/* Critères par catégorie */}
        {categories.map(cat => (
          <div key={cat} style={{ marginBottom:20 }}>
            <div style={{ color:CYAN,fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:10,borderBottom:"1px solid "+BRD,paddingBottom:6 }}>{cat}</div>
            {activeCriteria.filter(c=>c.category===cat).map(c => (
              <div key={c.id} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 4px",borderBottom:"1px solid "+DARK3 }}>
                <span style={{ color:TXT,fontSize:12,flex:1 }}>{c.label}</span>
                <StarRating value={scores[c.id]||0} onChange={v=>setScores(p=>({...p,[c.id]:v}))} />
              </div>
            ))}
          </div>
        ))}
        {/* Commentaire */}
        <div style={{ marginBottom:16 }}>
          <label style={{ color:TXT3,fontSize:11,fontWeight:600,display:"block",marginBottom:6 }}>Commentaire général (optionnel)</label>
          <textarea value={comment} onChange={e=>setComment(e.target.value)} rows={3} placeholder="Points forts, axes d'amélioration..."
            style={{ width:"100%",background:DARK3,border:"1px solid "+BRD,borderRadius:8,color:TXT,padding:"8px 12px",fontSize:12,resize:"vertical",fontFamily:"inherit" }} />
        </div>
        {/* Footer */}
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center" }}>
          <div style={{ color:TXT3,fontSize:12 }}>
            <span style={{ color:CYAN,fontWeight:700 }}>{filled}/{activeCriteria.length}</span> critères notés
            {filled>0 && <span style={{ color:ORANGE,fontWeight:700,marginLeft:12 }}>Moy : {avg}/5</span>}
          </div>
          <button onClick={save} disabled={saving||filled===0} style={{ padding:"10px 28px",background:filled>0?PURPLE:TXT3,border:"none",borderRadius:8,color:"#fff",fontWeight:700,cursor:filled>0?"pointer":"not-allowed",fontSize:13 }}>
            {saving?"⏳ Enregistrement...":(isEdit?"💾 Enregistrer les modifications":"💾 Enregistrer")}
          </button>
        </div>
      </div>
    </div>
  );
}

  const [selEval, setSelEval] = useState(null);
  const [editing, setEditing] = useState(false);
  const [printing, setPrinting] = useState(false);

  const reload = () => authFetch(`/api/kpi/evaluations/${encodeURIComponent(employee.name)}`)
      .then(r=>r.json()).then(d=>{ setEvals(d); setSelEval(prev => d.find(x=>x.id===prev?.id) || d[0] || null); setLoading(false); })
      .catch(()=>setLoading(false));
  useEffect(() => { reload(); }, [employee.name]);

  const canEdit = evaluator && (evaluator.isAdmin || evaluator.isChef || evaluator.canViewAll || evaluator.canViewKPI || selEval?.evaluator_name === evaluator.name);

  // Impression PDF : récupère l'analyse IA puis ouvre une fenêtre imprimable
  const printPDF = async () => {
    if (!selEval) return;
    setPrinting(true);
    let analysis = "";
    try {
      const r = await authFetch('/api/kpi/analysis', { method: 'POST', body: JSON.stringify({ evaluated_name: employee.name, evaluation_id: selEval.id }) });
      const d = await r.json();
      analysis = d.ok ? d.analysis : "(Analyse IA indisponible : " + (d.error || "") + ")";
    } catch (e) { analysis = "(Analyse IA indisponible.)"; }
    setPrinting(false);
    openKpiPrintWindow(employee, selEval, criteria.filter(c=>(c.profile||"ing")===profile), analysis);
  };

  const catColors = { "Qualité du travail":CYAN, "Délais & Productivité":ORANGE, "Autonomie & Initiative":GREEN, "Collaboration":BLUE, "Développement professionnel":PURPLE, "Management / Chef de projet":RED };

  const profile = kpiProfileOf(employee);
  const renderScores = (ev) => {
    if (!ev) return null;
    const profCriteria = criteria.filter(c=>c.active && (c.profile||"ing")===profile);
    const cats = [...new Set(profCriteria.map(c=>c.category))];
    return cats.map(cat => {
      const catCriteria = profCriteria.filter(c=>c.category===cat);
      const scores = catCriteria.map(c=>ev.scores[c.id]||0).filter(v=>v>0);
      const avg = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : "—";
      return (
        <div key={cat} style={{ marginBottom:16 }}>
          <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8 }}>
            <span style={{ color:catColors[cat]||CYAN,fontSize:11,fontWeight:700,textTransform:"uppercase" }}>{cat}</span>
            <span style={{ color:catColors[cat]||CYAN,fontSize:12,fontWeight:700 }}>{avg}{avg!=="—"?"/5":""}</span>
          </div>
          {catCriteria.map(c => (
            <div key={c.id} style={{ display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 4px",borderBottom:"1px solid "+DARK3 }}>
              <span style={{ color:TXT2,fontSize:11,flex:1 }}>{c.label}</span>
              <StarRating value={ev.scores[c.id]||0} onChange={()=>{}} readonly />
            </div>
          ))}
        </div>
      );
    });
  };

  return (
    <div onClick={onClose} style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:3000 }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:DARK2,border:"1px solid "+BRD,borderRadius:16,padding:28,width:"100%",maxWidth:720,maxHeight:"90vh",overflowY:"auto" }}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20 }}>
          <div>
            <h2 style={{ color:TXT,fontSize:18,fontWeight:700,margin:0 }}>📊 Historique KPI — {employee.name}</h2>
            <div style={{ color:TXT3,fontSize:12,marginTop:3 }}>{evals.length} évaluation{evals.length>1?"s":""} enregistrée{evals.length>1?"s":""}</div>
          </div>
          <div style={{ display:"flex",gap:8,alignItems:"center" }}>
            {selEval && canEdit && (
              <button onClick={()=>setEditing(true)} title="Corriger cette évaluation" style={{ padding:"6px 12px",background:CYAN+"22",border:"1px solid "+CYAN+"44",borderRadius:7,color:CYAN,fontSize:11,fontWeight:700,cursor:"pointer" }}>✏️ Modifier</button>
            )}
            {selEval && canEdit && (
              <button onClick={async()=>{ if(!window.confirm("Supprimer définitivement cette évaluation ("+selEval.period+") ?"))return; await authFetch('/api/kpi/evaluations/'+selEval.id,{method:'DELETE'}); reload(); }} title="Supprimer cette évaluation" style={{ padding:"6px 10px",background:RED+"18",border:"1px solid "+RED+"44",borderRadius:7,color:RED,fontSize:11,fontWeight:700,cursor:"pointer" }}>🗑️</button>
            )}
            {selEval && (
              <button onClick={printPDF} disabled={printing} title="Imprimer / exporter en PDF avec analyse IA" style={{ padding:"6px 12px",background:PURPLE+"22",border:"1px solid "+PURPLE+"44",borderRadius:7,color:PURPLE,fontSize:11,fontWeight:700,cursor:printing?"wait":"pointer" }}>{printing?"⏳ Analyse…":"🖨️ Imprimer PDF"}</button>
            )}
            <button onClick={onClose} style={{ background:"none",border:"none",color:TXT3,fontSize:22,cursor:"pointer" }}>✕</button>
          </div>
        </div>
        {loading && <div style={{ color:TXT3,textAlign:"center",padding:40 }}>Chargement...</div>}
        {!loading && !evals.length && <div style={{ color:TXT3,textAlign:"center",padding:40 }}>Aucune évaluation pour ce membre.</div>}
        {!loading && evals.length > 0 && (
          <div style={{ display:"flex",gap:16 }}>
            {/* Liste des périodes */}
            <div style={{ width:120,flexShrink:0 }}>
              <div style={{ color:TXT3,fontSize:10,fontWeight:700,marginBottom:8,textTransform:"uppercase" }}>Périodes</div>
              {evals.map(ev => {
                const vals = Object.values(ev.scores).filter(v=>v>0);
                const avg = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : "—";
                return (
                  <button key={ev.id} onClick={()=>setSelEval(ev)}
                    style={{ width:"100%",padding:"8px 10px",marginBottom:4,background:selEval?.id===ev.id?PURPLE+"33":DARK3,border:"1px solid "+(selEval?.id===ev.id?PURPLE:BRD),borderRadius:8,textAlign:"left",cursor:"pointer" }}>
                    <div style={{ color:TXT,fontSize:11,fontWeight:700 }}>{ev.period}</div>
                    <div style={{ color:ORANGE,fontSize:11,fontWeight:600 }}>★ {avg}/5</div>
                    <div style={{ color:TXT3,fontSize:9 }}>{ev.evaluator_name.split(" ")[1]||ev.evaluator_name}</div>
                  </button>
                );
              })}
            </div>
            {/* Détail */}
            <div style={{ flex:1 }}>
              {selEval && renderScores(selEval)}
              {selEval?.overall_comment && (
                <div style={{ marginTop:12,padding:"10px 14px",background:DARK3,borderRadius:8,color:TXT2,fontSize:12,fontStyle:"italic" }}>
                  💬 {selEval.overall_comment}
                </div>
              )}
            </div>
          </div>
        )}
      </div>
      {editing && selEval && (
        <KPIEvalModal evaluator={evaluator} evaluated={employee} criteria={criteria} existing={selEval}
          onClose={()=>setEditing(false)} onSaved={()=>{ setEditing(false); reload(); }} />
      )}
    </div>
  );
}

// ─── KPI : Fenêtre d'impression PDF (scores + analyse IA) ──────
function openKpiPrintWindow(employee, ev, criteria, analysis) {
  const cats = [...new Set(criteria.filter(c=>c.active).map(c=>c.category))];
  const allVals = Object.values(ev.scores).filter(v=>v>0);
  const globalAvg = allVals.length ? (allVals.reduce((a,b)=>a+b,0)/allVals.length).toFixed(2) : "—";
  const esc = s => String(s==null?"":s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const stars = n => "★".repeat(n) + "☆".repeat(5-n);
  let body = "";
  for (const cat of cats) {
    const cc = criteria.filter(c=>c.active && c.category===cat);
    const vals = cc.map(c=>ev.scores[c.id]||0).filter(v=>v>0);
    const avg = vals.length ? (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1) : "—";
    body += `<tr class="cat"><td colspan="2">${esc(cat)}</td><td class="avg">${avg}${avg!=="—"?"/5":""}</td></tr>`;
    for (const c of cc) {
      const v = ev.scores[c.id]||0;
      body += `<tr><td class="lbl">${esc(c.label)}</td><td class="star">${v>0?stars(v):"—"}</td><td class="num">${v>0?v+"/5":"—"}</td></tr>`;
    }
  }
  // Convertir le markdown léger de l'analyse en HTML
  const analysisHtml = esc(analysis)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^[•\-]\s?(.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>')
    .replace(/\n{2,}/g, '</p><p>')
    .replace(/\n/g, '<br>');
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>KPI ${esc(employee.name)} — ${esc(ev.period)}</title>
  <style>
    *{box-sizing:border-box} body{font-family:Arial,Helvetica,sans-serif;color:#1e293b;margin:0;padding:32px;max-width:800px}
    h1{font-size:22px;margin:0 0 2px} .sub{color:#64748b;font-size:12px;margin-bottom:4px}
    .brand{color:#2563eb;font-weight:800}
    .hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #2563eb;padding-bottom:12px;margin-bottom:18px}
    .glob{text-align:right} .glob .big{font-size:30px;font-weight:800;color:#f59e0b}
    table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:12px}
    td{padding:5px 8px;border-bottom:1px solid #e2e8f0}
    tr.cat td{background:#f1f5f9;font-weight:700;color:#0f172a;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
    tr.cat .avg{text-align:right;color:#2563eb}
    .lbl{width:60%} .star{color:#f59e0b;letter-spacing:2px} .num{text-align:right;width:60px;font-weight:600}
    .analysis{background:#f8fafc;border-left:4px solid #2563eb;border-radius:6px;padding:14px 18px;font-size:12.5px;line-height:1.65}
    .analysis h2,.analysis strong{color:#0f172a} .analysis ul{margin:6px 0 6px 18px;padding:0} .analysis li{margin:3px 0}
    .sec{font-size:13px;font-weight:700;color:#2563eb;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.5px}
    .foot{margin-top:26px;color:#94a3b8;font-size:10px;border-top:1px solid #e2e8f0;padding-top:10px}
    @media print{body{padding:0}.noprint{display:none}}
    .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:18px}
  </style></head><body>
  <button class="btn noprint" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button>
  <div class="hdr">
    <div><h1>Kanban <span class="brand">SOZAIS</span> — Évaluation KPI</h1>
      <div class="sub">${esc(employee.name)} · ${esc(employee.role||"")}${employee.pole?" · "+esc(employee.pole):""}</div>
      <div class="sub">Période : <strong>${esc(ev.period)}</strong> · Évaluateur : ${esc(ev.evaluator_name||"—")}</div></div>
    <div class="glob"><div style="font-size:11px;color:#64748b">Note globale</div><div class="big">${globalAvg}<span style="font-size:16px;color:#94a3b8">/5</span></div></div>
  </div>
  <div class="sec">Détail des critères</div>
  <table>${body}</table>
  ${ev.overall_comment?`<div class="sec">Commentaire de l'évaluateur</div><div style="font-style:italic;color:#475569;font-size:12.5px;margin-bottom:16px">« ${esc(ev.overall_comment)} »</div>`:""}
  <div class="sec">🤖 Analyse IA</div>
  <div class="analysis"><p>${analysisHtml}</p></div>
  <div class="foot">Document généré automatiquement par Kanban SOZAIS le ${new Date().toLocaleDateString("fr-FR")} — Confidentiel RH.</div>
  </body></html>`;
  const w = window.open("", "_blank");
  if (!w) { alert("Autorisez les fenêtres pop-up pour imprimer le PDF."); return; }
  w.document.write(html); w.document.close();
}

// ─── KPI : Fenêtre d'impression PDF groupée (tout un pôle) ────
function openKpiPolePrintWindow(pole, membres, criteria) {
  const esc = s => String(s==null?"":s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const stars = n => "★".repeat(n) + "☆".repeat(5-n);
  const mdToHtml = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^[•\-]\s?(.+)$/gm,'<li>$1</li>').replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>').replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');
  // Classement du pôle par note globale
  const classement = [...membres].sort((a,b)=>parseFloat(b.globalAvg)-parseFloat(a.globalAvg));
  const moyPole = membres.length ? (membres.reduce((a,b)=>a+parseFloat(b.globalAvg),0)/membres.length).toFixed(2) : "—";

  let sections = "";
  for (const m of classement) {
    const prof = kpiProfileOf(m);
    const mCriteria = criteria.filter(c=>c.active && (c.profile||"ing")===prof);
    const cats = [...new Set(mCriteria.map(c=>c.category))];
    let body = "";
    for (const cat of cats) {
      const cc = mCriteria.filter(c=>c.category===cat);
      const vals = cc.map(c=>m.scores[c.id]||0).filter(v=>v>0);
      if (!vals.length) continue;
      const avg = (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
      body += `<tr class="cat"><td colspan="2">${esc(cat)}</td><td class="avg">${avg}/5</td></tr>`;
      for (const c of cc) { const v=m.scores[c.id]||0; if(v>0) body += `<tr><td class="lbl">${esc(c.label)}</td><td class="star">${stars(v)}</td><td class="num">${v}/5</td></tr>`; }
    }
    sections += `<div class="member">
      <div class="mhead"><div><span class="mname">${esc(m.name)}</span> <span class="mrole">${esc(m.role||"")}</span></div>
        <div class="mavg">${m.globalAvg}<span>/5</span></div></div>
      <div class="msub">Période ${esc(m.period)} · Évaluateur ${esc(m.evaluator||"—")}</div>
      <table>${body}</table>
      ${m.comment?`<div class="comment">💬 « ${esc(m.comment)} »</div>`:""}
      <div class="ana-title">🤖 Analyse IA</div><div class="analysis"><p>${mdToHtml(m.analysis)}</p></div>
    </div>`;
  }
  const rows = classement.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.name)}</td><td>${esc(m.role||"")}</td><td class="r">${m.globalAvg}/5</td></tr>`).join("");
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>KPI Pôle ${esc(pole)}</title><style>
    *{box-sizing:border-box} body{font-family:Arial,Helvetica,sans-serif;color:#1e293b;margin:0;padding:32px}
    .brand{color:#2563eb;font-weight:800}
    .hdr{border-bottom:3px solid #2563eb;padding-bottom:12px;margin-bottom:20px}
    h1{font-size:22px;margin:0} .sub{color:#64748b;font-size:12px;margin-top:4px}
    .recap{background:#f1f5f9;border-radius:8px;padding:14px 18px;margin-bottom:24px}
    .recap h3{margin:0 0 8px;font-size:13px;color:#2563eb;text-transform:uppercase;letter-spacing:.5px}
    table{width:100%;border-collapse:collapse;font-size:12px} td{padding:5px 8px;border-bottom:1px solid #e2e8f0}
    .recap table td{border-bottom:1px solid #dbe3ea} .recap .r{text-align:right;font-weight:700;color:#f59e0b}
    .member{page-break-inside:avoid;border:1px solid #e2e8f0;border-radius:10px;padding:16px 18px;margin-bottom:18px}
    .mhead{display:flex;justify-content:space-between;align-items:center} .mname{font-size:16px;font-weight:800} .mrole{color:#64748b;font-size:12px}
    .mavg{font-size:24px;font-weight:800;color:#f59e0b} .mavg span{font-size:14px;color:#94a3b8}
    .msub{color:#64748b;font-size:11px;margin:2px 0 10px}
    tr.cat td{background:#f8fafc;font-weight:700;font-size:11px;text-transform:uppercase} tr.cat .avg{text-align:right;color:#2563eb}
    .lbl{width:58%} .star{color:#f59e0b;letter-spacing:2px} .num{text-align:right;width:52px;font-weight:600}
    .comment{font-style:italic;color:#475569;font-size:12px;margin:8px 0}
    .ana-title{font-size:12px;font-weight:700;color:#2563eb;margin:10px 0 6px;text-transform:uppercase}
    .analysis{background:#f8fafc;border-left:4px solid #2563eb;border-radius:6px;padding:10px 14px;font-size:12px;line-height:1.6}
    .analysis ul{margin:4px 0 4px 16px;padding:0}
    .foot{margin-top:20px;color:#94a3b8;font-size:10px;border-top:1px solid #e2e8f0;padding-top:10px}
    .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:700;cursor:pointer;margin-bottom:18px}
    @media print{body{padding:0}.noprint{display:none}.member{border-color:#cbd5e1}}
  </style></head><body>
  <button class="btn noprint" onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button>
  <div class="hdr"><h1>Kanban <span class="brand">SOZAÏS</span> — Bilan KPI · Pôle ${esc(pole)}</h1>
    <div class="sub">${membres.length} membre(s) évalué(s) · Moyenne du pôle : <strong>${moyPole}/5</strong> · ${new Date().toLocaleDateString("fr-FR")}</div></div>
  <div class="recap"><h3>Classement du pôle</h3><table><tr style="font-weight:700;color:#475569"><td>#</td><td>Nom</td><td>Poste</td><td class="r">Note</td></tr>${rows}</table></div>

  if (!w) { alert("Autorisez les fenêtres pop-up pour imprimer le PDF."); return; }
  w.document.write(html); w.document.close();
}

// ─── KPI : Modal Gestion des critères (admin) ─────────────────
function KPIManageModal({ criteria, onClose, onRefresh }) {
  const [list, setList] = useState(criteria);
  const [newLabel, setNewLabel] = useState("");
  const [newCat, setNewCat] = useState("Personnalisé");
  const [newProfile, setNewProfile] = useState("ing");
  const [saving, setSaving] = useState(false);

  const profiles = ["ing","assistant","finance","commercial","it"];
  const categories = [...new Set(criteria.filter(c=>(c.profile||"ing")===newProfile).map(c=>c.category))];

  const toggleActive = async (c) => {
    const updated = list.map(x=>x.id===c.id?{...x,active:x.active?0:1}:x);
    setList(updated);
    await authFetch(`/api/kpi/criteria/${c.id}`,{ method:"PATCH",body:JSON.stringify({active:!c.active}) });
  };

  const deleteCriteria = async (c) => {
    if(!window.confirm(`Supprimer "${c.label}" ?`)) return;
    setList(l=>l.filter(x=>x.id!==c.id));
    await authFetch(`/api/kpi/criteria/${c.id}`,{ method:"DELETE" });
  };

  const addCriteria = async () => {
    if(!newLabel.trim()) return;
    setSaving(true);
    const r = await authFetch("/api/kpi/criteria",{ method:"POST",body:JSON.stringify({label:newLabel.trim(),category:newCat,profile:newProfile}) });
    const d = await r.json();
    if(d.ok) { setList(l=>[...l,{id:d.id,label:newLabel.trim(),category:newCat,profile:newProfile,active:1,position:l.length+1}]); setNewLabel(""); }
    setSaving(false);
  };

  return (
    <div onClick={onClose} style={{ position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",backdropFilter:"blur(8px)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:3000 }}>
      <div onClick={e=>e.stopPropagation()} style={{ background:DARK2,border:"1px solid "+BRD,borderRadius:16,padding:28,width:"100%",maxWidth:620,maxHeight:"90vh",overflowY:"auto" }}>
        <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20 }}>
          <h2 style={{ color:TXT,fontSize:18,fontWeight:700,margin:0 }}>⚙️ Gérer les critères KPI</h2>
          <button onClick={()=>{onRefresh();onClose();}} style={{ background:"none",border:"none",color:TXT3,fontSize:22,cursor:"pointer" }}>✕</button>
        </div>
        {/* Sélecteur de profil */}
        <div style={{ display:"flex",gap:6,marginBottom:16,flexWrap:"wrap" }}>
          {profiles.map(p=>(
            <button key={p} onClick={()=>{setNewProfile(p);setNewCat("Personnalisé");}} style={{ padding:"5px 12px",background:newProfile===p?PURPLE+"33":DARK3,border:"1px solid "+(newProfile===p?PURPLE:BRD),borderRadius:7,color:newProfile===p?PURPLE:TXT2,fontSize:11,fontWeight:700,cursor:"pointer" }}>{KPI_PROFILE_LABELS[p]}</button>
          ))}
        </div>
        {/* Ajouter un critère */}
        <div style={{ padding:"14px 16px",background:DARK3,borderRadius:10,marginBottom:20 }}>
          <div style={{ color:GREEN,fontSize:12,fontWeight:700,marginBottom:10 }}>➕ Ajouter un critère — profil « {KPI_PROFILE_LABELS[newProfile]} »</div>
          <div style={{ display:"flex",gap:8,marginBottom:8 }}>
            <input value={newLabel} onChange={e=>setNewLabel(e.target.value)} placeholder="Intitulé du critère..."
              onKeyDown={e=>e.key==="Enter"&&addCriteria()}
              style={{ flex:1,background:DARK,border:"1px solid "+BRD,borderRadius:7,color:TXT,padding:"7px 10px",fontSize:12 }} />
          </div>
          <div style={{ display:"flex",gap:8,alignItems:"center" }}>
            <input value={newCat==="Personnalisé"?"":newCat} onChange={e=>setNewCat(e.target.value||"Personnalisé")} list="kpi-cats" placeholder="Catégorie…"
              style={{ flex:1,background:DARK,border:"1px solid "+BRD,borderRadius:7,color:TXT,padding:"7px 10px",fontSize:12 }} />
            <datalist id="kpi-cats">{categories.map(c=><option key={c} value={c} />)}</datalist>
            <button onClick={addCriteria} disabled={saving||!newLabel.trim()} style={{ padding:"7px 18px",background:newLabel.trim()?GREEN:TXT3,border:"none",borderRadius:7,color:"#fff",fontWeight:700,cursor:newLabel.trim()?"pointer":"not-allowed",fontSize:12 }}>Ajouter</button>
          </div>
        </div>
        {/* Liste (filtrée par profil sélectionné) */}
        {[...new Set(list.filter(c=>(c.profile||"ing")===newProfile).map(c=>c.category))].map(cat=>(

    </div>
  );
}

// ─── Vue Planning Gantt ───────────────────────────────────────
function GanttView({ user, empList, all, tick }) {
  const [weekOffset, setWeekOffset] = useState(0);
  const [hovered, setHovered] = useState(null);
  const [ganttPole, setGanttPole] = useState("all");

  const today = new Date(); today.setHours(0,0,0,0);
  const rangeStart = new Date(today); rangeStart.setDate(today.getDate() - 2 + weekOffset * 7);
  const rangeEnd   = new Date(rangeStart); rangeEnd.setDate(rangeStart.getDate() + 20);
  const TOTAL_DAYS = 21;

  const days = [];
  for (let d = new Date(rangeStart); d <= rangeEnd; d.setDate(d.getDate() + 1)) days.push(new Date(d));

  const dayIdx = (date) => {
    const d = new Date(date); d.setHours(0,0,0,0);
    return Math.round((d - rangeStart) / 86400000);
  };

  const allMembers = user.pole === "Direction" ? []
    : user.isAdmin
      ? empList.filter(e => (!e.isAdmin && e.pole !== "Direction") || e.name === user.name)
      : user.isChef
        ? empList.filter(e => e.pole === user.pole)
        : [empList.find(e => e.name === user.name)].filter(Boolean);

  const members = ganttPole === "all" ? allMembers
    : allMembers.filter(e => e.pole === ganttPole);

  const ganttPoles = user.isAdmin
    ? ["all", ...new Set(allMembers.map(e => e.pole).filter(Boolean))]
    : [];

  const prioColor = { high: RED, medium: ORANGE, low: GREEN };
  const DAY_NAMES = ["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"];
  const MONTH_NAMES = ["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
  const ROW_H = 30;
  const LABEL_W = 164;

  const getMemberRows = (member) => {
    const tasks = (all[member.name] || []).filter(t => t.column !== "done");
    const sorted = [...tasks].sort((a,b) => {
      if (!a.deadline) return 1; if (!b.deadline) return -1;
      return new Date(a.deadline) - new Date(b.deadline);
    });
    const rows = [];
    for (const task of sorted) {
      const dlDate = task.deadline ? new Date(task.deadline) : null;
      if (dlDate) dlDate.setHours(0,0,0,0);
      const sdDate = task.startDate ? new Date(task.startDate) : null;
      if (sdDate) sdDate.setHours(0,0,0,0);
      const barStart = sdDate ? Math.max(0, dayIdx(sdDate)) : Math.max(0, dayIdx(today) - 1);
      const barEnd   = dlDate ? Math.min(TOTAL_DAYS - 1, dayIdx(dlDate)) : Math.min(TOTAL_DAYS - 1, dayIdx(today) + 4);
      const width = Math.max(1, barEnd - barStart);
      let placed = false;
      for (let r = 0; r < rows.length; r++) {
        if (!rows[r].some(b => !(b.end < barStart || b.start > barEnd))) {
          rows[r].push({ task, start: barStart, end: barEnd, width }); placed = true; break;
        }
      }
      if (!placed) rows.push([{ task, start: barStart, end: barEnd, width }]);
    }
    return rows;
  };

  return (
    <div style={{ flex:1, overflow:"auto", padding:"14px 20px" }}>
      {/* Toolbar */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10, flexWrap:"wrap", gap:8 }}>
        <div style={{ color:TXT, fontSize:15, fontWeight:700 }}>
          📅 Planning — {MONTH_NAMES[rangeStart.getMonth()]} {rangeStart.getFullYear()}
        </div>
        <div style={{ display:"flex", gap:6 }}>
          {[["◀ Préc.", () => setWeekOffset(w=>w-1)], ["Aujourd'hui", () => setWeekOffset(0)], ["Suiv. ▶", () => setWeekOffset(w=>w+1)]].map(([l, fn]) => (
            <button key={l} onClick={fn}
              style={{ padding:"7px 14px", background: l==="Aujourd'hui" && weekOffset===0 ? BLUE+"22" : DARK2, border:"1px solid "+(l==="Aujourd'hui" && weekOffset===0 ? BLUE : BRD), borderRadius:7, color: l==="Aujourd'hui" && weekOffset===0 ? BLUE : TXT2, fontSize:12, fontWeight:600, cursor:"pointer" }}>
              {l}
            </button>
          ))}
        </div>
      </div>
      {/* Filtre pôle (Super Admin uniquement) */}
      {ganttPoles.length > 0 && (
        <div style={{ display:"flex", gap:6, marginBottom:12, flexWrap:"wrap" }}>
          {ganttPoles.map(p => {
            const col = p==="all" ? TXT2 : p==="Fluide" ? BLUE : p==="Élec" ? RED : p==="Commercial" ? ORANGE : PURPLE;
            const label = p==="all" ? "Tous" : p==="Admin" ? "🛡️ Admin" : (p==="Fluide" ? "💧 " : p==="Élec" ? "⚡ " : p==="Commercial" ? "🤝 " : "") + p;
            return (
              <button key={p} onClick={() => setGanttPole(p)}
                style={{ padding:"5px 13px", background: ganttPole===p ? col+"22" : DARK2, border:"1px solid "+(ganttPole===p ? col+"88" : BRD), borderRadius:99, color: ganttPole===p ? col : TXT3, fontSize:11, fontWeight:600, cursor:"pointer" }}>
                {label}
              </button>
            );
          })}
        </div>
      )}

      {/* Gantt table */}
      <div style={{ background:DARK2, borderRadius:12, border:"1px solid "+BRD, overflow:"hidden" }}>
        {/* Day header */}
        <div style={{ display:"flex", borderBottom:"1px solid "+BRD, background:DARK, position:"sticky", top:0, zIndex:10 }}>
          <div style={{ width:LABEL_W, flexShrink:0, padding:"10px 14px", borderRight:"1px solid "+BRD }}>
            <span style={{ color:TXT3, fontSize:10, fontWeight:600, textTransform:"uppercase" }}>Collaborateur</span>
          </div>
          <div style={{ flex:1, display:"flex" }}>
            {days.map((d, i) => {
              const isToday   = d.getTime() === today.getTime();
              const isWeekend = d.getDay()===0 || d.getDay()===6;
              return (
                <div key={i} style={{ flex:1, textAlign:"center", padding:"6px 2px", borderRight:"1px solid "+BRD+"44", background: isToday ? BLUE+"22" : "transparent" }}>
                  <div style={{ color: isToday ? BLUE : isWeekend ? TXT3+"88" : TXT3, fontSize:9, fontWeight: isToday ? 700 : 400 }}>{DAY_NAMES[d.getDay()]}</div>
                  <div style={{ color: isToday ? BLUE : isWeekend ? TXT3+"88" : TXT2, fontSize:11, fontWeight: isToday ? 700 : 500 }}>{d.getDate()}</div>
                </div>
              );
            })}
          </div>
        </div>

        {/* Member rows */}
        {members.length === 0 && (
          <div style={{ padding:40, textAlign:"center", color:TXT3 }}>Aucun membre à afficher dans la vue planning.</div>
        )}
        {members.map((member, mi) => {
          const rows = getMemberRows(member);
          const rowCount = Math.max(1, rows.length);
          const taskCount = (all[member.name]||[]).filter(t=>t.column!=="done").length;
          return (
            <div key={member.name} style={{ display:"flex", borderBottom:"1px solid "+BRD, background: mi%2===0 ? DARK2 : DARK }}>
              {/* Label */}
              <div style={{ width:LABEL_W, flexShrink:0, padding:"10px 14px", borderRight:"1px solid "+BRD, display:"flex", alignItems:"center", gap:8 }}>
                <div style={{ width:28, height:28, borderRadius:99, background:member.isChef ? (member.pole==="Fluide"?BLUE:RED)+"44" : DARK3, display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontSize:10, fontWeight:800, flexShrink:0 }}>
                  {member.name.split(" ").map(n=>n[0]).join("").slice(0,2)}
                </div>
                <div>
                  <div style={{ color:TXT, fontSize:11, fontWeight:600, lineHeight:1.2 }}>{member.name.split(" ").slice(-1)[0]}</div>
                  <div style={{ color:TXT3, fontSize:9 }}>{taskCount} tâche{taskCount!==1?"s":""}</div>
                </div>
              </div>
              {/* Bars */}
              <div style={{ flex:1, position:"relative", minHeight: rowCount * ROW_H + 8 }}>
                {/* Background: weekend + today shading */}
                {days.map((d, i) => {
                  const isToday   = d.getTime() === today.getTime();
                  const isWeekend = d.getDay()===0 || d.getDay()===6;
                  if (!isToday && !isWeekend) return null;
                  return <div key={i} style={{ position:"absolute", top:0, bottom:0, left:`${(i/TOTAL_DAYS)*100}%`, width:`${(1/TOTAL_DAYS)*100}%`, background: isToday ? BLUE+"1a" : BRD+"33", pointerEvents:"none" }} />;
                })}
                {/* Task bars */}
                {rows.map((row, ri) => row.map(({ task, start, end, width }) => {
                  const isOverdue = task.deadline && new Date(new Date(task.deadline).setHours(0,0,0,0)) < today;
                  const color = isOverdue ? RED : prioColor[task.priority] || BLUE;
                  const left  = `${(Math.max(0,start)/TOTAL_DAYS)*100}%`;
                  const w     = `${(Math.min(width+1, TOTAL_DAYS-Math.max(0,start))/TOTAL_DAYS)*100}%`;
                  return (
                    <div key={task.id}
                      title={`${task.title}${task.deadline?" → "+task.deadline:""}${isOverdue?" ⚠️ En retard":""}`}
                      onMouseEnter={()=>setHovered(task.id)} onMouseLeave={()=>setHovered(null)}
                      style={{ position:"absolute", left, width:w, top: 4+ri*ROW_H, height: ROW_H-6, background: color+(hovered===task.id ? "ee" : "bb"), borderRadius:4, display:"flex", alignItems:"center", paddingLeft:6, overflow:"hidden", cursor:"default", borderLeft: isOverdue ? "3px solid "+RED : "none", transition:"opacity .12s", boxShadow: hovered===task.id ? "0 2px 8px "+color+"55" : "none" }}>
                      <span style={{ color:"#fff", fontSize:10, fontWeight:600, whiteSpace:"nowrap", textOverflow:"ellipsis", overflow:"hidden" }}>
                        {isOverdue ? "⚠️ " : ""}{task.title}
                      </span>
                    </div>
                  );
                }))}
              </div>
            </div>
          );
        })}
      </div>

      {/* Légende */}
      <div style={{ display:"flex", gap:14, marginTop:10, flexWrap:"wrap", alignItems:"center" }}>
        {[["En retard",RED],["Urgent",ORANGE],["Normal",GREEN],["Bas",BLUE]].map(([l,c])=>(
          <div key={l} style={{ display:"flex", alignItems:"center", gap:5 }}>
            <div style={{ width:12, height:12, borderRadius:3, background:c }} />
            <span style={{ color:TXT3, fontSize:11 }}>{l}</span>
          </div>
        ))}
        <div style={{ display:"flex", alignItems:"center", gap:5 }}>
          <div style={{ width:12, height:12, borderRadius:3, background:BLUE+"22", border:"1px solid "+BLUE }} />
          <span style={{ color:TXT3, fontSize:11 }}>Aujourd'hui</span>
        </div>
      </div>
    </div>
  );
}

// ─── Décode le payload JWT sans vérification (usage client uniquement) ───
function decodeJwtPayload(token) {
  try {
    const payload = token.split('.')[1];
    return JSON.parse(atob(payload.replace(/-/g,'+').replace(/_/g,'/')));
  } catch { return null; }
}

// ─── Main App ───
function App() {
  // Tenter de restaurer la session depuis sessionStorage
  const [user, setUser] = useState(() => {
    const token = getToken();
    if (!token) return null;
    const payload = decodeJwtPayload(token);
    if (!payload || payload.exp * 1000 < Date.now()) { setToken(null); return null; }
    return payload;
  });
  const [showLanding, setShowLanding] = useState(() => !getToken());
  const [viewMode, setViewMode] = useState("kanban"); // "kanban" | "planning"
  const [all, setAll] = useState({});
  const [loading, setLoading] = useState(false);
  const [admin, setAdmin] = useState(false);
  const [af, setAf] = useState("all");
  const [teamPole, setTeamPole] = useState("all");
  const [sideSearch, setSideSearch] = useState("");
  const [sidePrio, setSidePrio] = useState("all");
  const [settings, setSettings] = useState(false);
  const [settingsTab, setSettingsTab] = useState("password");
  const [empModal, setEmpModal] = useState(false);
  const [tick, setTick] = useState(0);
  const [empList, setEmpList] = useState(DEFAULT_EMPLOYEES);
  const allRef = useRef(all);
  allRef.current = all;
  const userRef = useRef(user);
  userRef.current = user;
  const empListRef = useRef(empList);
  empListRef.current = empList;

  // ─── Minuteur de pointage journalier ─────────────────────────
  const [dailyTimer, setDailyTimer] = useState({ running: false, startedAt: null, seconds: 0 });

  const fmtTime = (sec) => {
    const h = Math.floor(sec / 3600).toString().padStart(2,"0");
    const m = Math.floor((sec % 3600) / 60).toString().padStart(2,"0");
    const s = (sec % 60).toString().padStart(2,"0");
    return `${h}:${m}:${s}`;
  };

  // Charger le minuteur depuis localStorage lors du login
  useEffect(() => {
    if (!user) return;
    const key = `dt_${user.name}_${new Date().toISOString().slice(0,10)}`;
    try {
      const saved = JSON.parse(localStorage.getItem(key) || "{}");
      const s = saved.seconds || 0;
      if (saved.running && saved.startedAt) {
        const elapsed = Math.floor((Date.now() - saved.startedAt) / 1000);
        setDailyTimer({ running: true, startedAt: saved.startedAt, seconds: s + elapsed });
      } else {
        setDailyTimer({ running: false, startedAt: null, seconds: s });
      }
    } catch { setDailyTimer({ running: false, startedAt: null, seconds: 0 }); }
  }, [user?.name]);

  // Sauvegarder le minuteur dans localStorage + serveur
  const saveDailyTimer = useCallback((dt) => {
    if (!user) return;
    const dateStr = new Date().toISOString().slice(0,10);
    const key = `dt_${user.name}_${dateStr}`;
    localStorage.setItem(key, JSON.stringify(dt));
    // Persistance serveur (best-effort)
    authFetch(`/api/timer/daily/${encodeURIComponent(user.name)}`, {
      method: "POST",
      body: JSON.stringify({ date: dateStr, seconds: dt.seconds, running: dt.running, startedAt: dt.startedAt }),
    }).catch(() => {});
  }, [user?.name]);

  const toggleDailyTimer = useCallback(() => {
    setDailyTimer(prev => {
      let next;
      if (prev.running) {
        const elapsed = prev.startedAt ? Math.floor((Date.now() - prev.startedAt) / 1000) : 0;
        next = { running: false, startedAt: null, seconds: prev.seconds + elapsed };
      } else {
        next = { running: true, startedAt: Date.now(), seconds: prev.seconds };
      }
      saveDailyTimer(next);
      return next;
    });
  }, [saveDailyTimer]);

  const dailyDisplaySeconds = dailyTimer.running && dailyTimer.startedAt
    ? dailyTimer.seconds + Math.floor((Date.now() - dailyTimer.startedAt) / 1000)
    : dailyTimer.seconds;
  // ─── États Import Excel ───────────────────────────────────
  const [importModal, setImportModal] = useState(false);
  // ─── États Rentabilité ────────────────────────────────────
  const [profitabilityOpen, setProfitabilityOpen] = useState(false);
  const [kpiOpen, setKpiOpen] = useState(false);
  const [kpiCriteria, setKpiCriteria] = useState([]);
  useEffect(() => { if (user) authFetch("/api/kpi/criteria").then(r=>r.json()).then(setKpiCriteria).catch(()=>{}); }, [user]);
  const [fixedCostsOpen, setFixedCostsOpen]       = useState(false);
  // ─── Mode sombre/clair ────────────────────────────────────
  const [isDark, setIsDark] = useState(() => localStorage.getItem('kbtheme') === 'dark');
  applyTheme(isDark);
  // ─── Notifications ────────────────────────────────────────
  const [notifs, setNotifs] = useState([]);
  const [notifsOpen, setNotifsOpen] = useState(false);
  const unseenCount = notifs.filter(n => !n.seen).length;

  // ─── États IA ─────────────────────────────────────────────
  const [chatOpen, setChatOpen] = useState(true);

  const lastActivityRef = useRef(Date.now());

  // Charger la liste minimale (sans auth) pour l'écran de login
  useEffect(() => {

  // ─── Chargement initial : employés PUIS tâches (ordre garanti, pas de re-run) ──

  // car setEmpList() déclencherait un reload des tâches APRÈS que l'utilisateur
  // a créé une carte → race condition → la carte disparaît si saveTasks n'a pas fini.
  useEffect(() => {
    if (!user) return;
    (async () => {
      setLoading(true);
      // 1. Charger la liste complète des employés (avec auth)
      const stored = await loadEmployees();
      const emps = (stored && stored.length > 0) ? stored : empListRef.current;
      if (stored && stored.length > 0) setEmpList(stored);
      // 2. Charger les tâches avec la liste à jour
      if (user.pole === "Direction") {
        const ms = emps.filter((e) => e.pole === "Direction");
        const ld = {};
        for (const m of ms) ld[m.name] = await loadTasks(m.name);
        setAll(ld);
      } else if (user.isAdmin) {

        setAll({ [user.name]: await loadTasks(user.name) });

  useEffect(() => { const id = setInterval(() => setTick((t) => t + 1), 1000); return () => clearInterval(id); }, []);

  // ─── Pause automatique des timers de TÂCHES après 20 min d'inactivité ─────────
  // Note : la pause ne se déclenche PAS si la page est en arrière-plan (AutoCAD, Revit, Excel…)
  // Quand l'utilisateur revient sur le navigateur, le compteur d'inactivité est réinitialisé.
  useEffect(() => {
    const onActivity = () => { lastActivityRef.current = Date.now(); };
    // Réinitialiser le compteur dès que la page redevient visible (retour depuis un autre logiciel)
    const onVisibility = () => { if (!document.hidden) lastActivityRef.current = Date.now(); };
    window.addEventListener("mousemove",          onActivity);
    window.addEventListener("keydown",            onActivity);
    window.addEventListener("click",              onActivity);
    window.addEventListener("scroll",             onActivity);
    document.addEventListener("visibilitychange", onVisibility);

    const id = setInterval(() => {
      // Ne jamais pauser si la page est en arrière-plan (utilisateur sur AutoCAD, Revit, etc.)
      if (document.hidden) return;
      if (Date.now() - lastActivityRef.current < INACTIVITY_MS) return;
      // FIX CRITIQUE : ne pauser QUE les timers de l'utilisateur courant.
      // Avant, on re-sauvegardait les listes de TOUS les membres visibles à
      // partir d'une copie locale périmée → effacement des cartes créées par
      // les membres entre-temps (le serveur remplace la liste complète).
      const me = userRef.current;
      if (!me) return;
      const myTasks = allRef.current[me.name];
      if (!myTasks || !myTasks.some((t) => t.timerRunning)) return;
      const now = Date.now();
      const updated = myTasks.map((t) => {
        if (!t.timerRunning) return t;
        const elapsed = t.timerStartedAt ? Math.floor((now - t.timerStartedAt) / 1000) : 0;
        return { ...t, timerRunning: false, timerStartedAt: null, timerSeconds: (t.timerSeconds || 0) + elapsed };
      });
      saveTasks(me.name, updated); // hors du setAll updater (pureté React 18)
      setAll((prev) => ({ ...prev, [me.name]: updated }));
      setInactivityPaused(true);
      setTimeout(() => setInactivityPaused(false), 6000);
    }, 30000); // vérifie toutes les 30 secondes

    return () => {
      clearInterval(id);
      window.removeEventListener("mousemove",          onActivity);
      window.removeEventListener("keydown",            onActivity);
      window.removeEventListener("click",              onActivity);
      window.removeEventListener("scroll",             onActivity);
      document.removeEventListener("visibilitychange", onVisibility);
    };
  }, []);
  useEffect(() => {
    if (tick % 10 !== 0 || tick === 0) return;
    // Seul le propriétaire sauvegarde son propre timer (évite que l'admin écrase
    // le timer d'un collègue avec une vue périmée)
    if (!user) return;
    const myTasks = allRef.current[user.name];
    if (myTasks && myTasks.some((x) => x.timerRunning)) saveTasks(user.name, myTasks);

  const refetchAll = useCallback(async () => {

      for (const m of ms) ld[m.name] = await loadTasks(m.name);
      setAll(ld);

      const ms = empList.filter((e) => !e.isAdmin || e.name === user.name);
      const ld = {};
      for (const m of ms) ld[m.name] = await loadTasks(m.name);
      setAll(ld);
    } else if (user.isChef) {
      const ms = empList.filter((e) => e.pole === user.pole);
      const ld = {};
      for (const m of ms) ld[m.name] = await loadTasks(m.name);
      setAll(ld);

  const upd = useCallback((n, newTasks) => {
    // Lire l'état courant via allRef (toujours à jour) — évite les closures périmées
    const existing = allRef.current[n] || [];
    const search = sideSearchRef.current;
    const prio   = sidePrioRef.current;

    // Reconstruire quelles tâches le Board pouvait voir (filtre actif)
    const wasVisible = (t) => {
      const ms = !search || (t.title || "").toLowerCase().includes(search.toLowerCase()) || (t.project || "").toLowerCase().includes(search.toLowerCase());
      const mp = prio === "all" || t.priority === prio;
      return ms && mp;
    };
    const visibleIds = new Set(existing.filter(wasVisible).map(t => t.id));

    // Conserver les tâches que le Board ne voyait pas (hors filtre) — elles n'ont pas changé
    const hidden = existing.filter(t => !visibleIds.has(t.id));

    // Fusionner : modifications du Board + tâches cachées préservées
    const merged = [...newTasks, ...hidden];

    // saveTasks DOIT être appelé en dehors du setAll updater — en React 18 concurrent mode,
    // les updaters peuvent s'exécuter plusieurs fois (pureté requise), donc tout effet de bord
    // (appel réseau, sauvegarde) doit être hors du updater pour être fiable.
    saveTasks(n, merged);
    setAll((p) => ({ ...p, [n]: merged }));
  }, []);

  const handleParseCreate = useCallback(async (cards) => {
    const byOwner = {};
    cards.forEach(c => {
      (byOwner[c.owner] = byOwner[c.owner] || []).push({
        id: genId(), title: c.title, project: c.project || '', description: c.description || '',
        priority: c.priority || 'medium', column: 'todo', deadline: c.deadline || '',
        estimatedHours: c.estimatedHours === '' || c.estimatedHours == null ? '' : String(c.estimatedHours),
        timerSeconds: 0, timerRunning: false, timerStartedAt: null,
        createdAt: new Date().toISOString(), createdBy: userRef.current?.name || null,
      });
    });
    const current = allRef.current;
    const updates = {};
    for (const [name, newTasks] of Object.entries(byOwner)) {
      // Si le tableau de ce membre n'est pas chargé localement, on le recharge
      // depuis le serveur AVANT de fusionner — sinon on écraserait ses cartes.
      const existing = current[name] !== undefined ? current[name] : await loadTasks(name);
      updates[name] = [...existing, ...newTasks];
      saveTasks(name, updates[name]);
    }
    setAll(prev => ({ ...prev, ...updates }));
  }, []);

  const reassign = useCallback(async (fromName, toName, task) => {
    try {
      // Appel API ciblé : UPDATE owner_name uniquement, sans écraser les tâches existantes
      await authFetch(`/api/tasks/${encodeURIComponent(task.id)}/reassign`, {
        method: 'PATCH',
        body: JSON.stringify({ newOwner: toName }),
      });
    } catch (e) { console.error("reassign failed", e); return; }

    // Mettre à jour l'état local
    setAll((prev) => {
      const fromTasks = (prev[fromName] || []).filter((t) => t.id !== task.id);
      // Si les tâches de la cible sont déjà chargées, on les met à jour localement
      const prevTo = prev[toName];
      const toTasks = prevTo ? [...prevTo.filter(t => t.id !== task.id), { ...task, owner_name: toName }] : undefined;
      const next = { ...prev, [fromName]: fromTasks };
      if (toTasks !== undefined) next[toName] = toTasks;
      return next;
    });
  }, []);

  const toggleTimer = useCallback((empName, taskId) => {
    setAll((prev) => {
      const tasks = prev[empName] || [];
      const task = tasks.find((t) => t.id === taskId);
      if (!task) return prev;
      const isStarting = !task.timerRunning;
      const now = Date.now();
      const updated = tasks.map((t) => {
        if (t.id === taskId) {
          if (isStarting) return { ...t, timerRunning: true, timerStartedAt: now };
          const elapsed = t.timerStartedAt ? Math.floor((now - t.timerStartedAt) / 1000) : 0;
          return { ...t, timerRunning: false, timerStartedAt: null, timerSeconds: (t.timerSeconds || 0) + elapsed };
        }
        if (isStarting && t.timerRunning) {
          const elapsed = t.timerStartedAt ? Math.floor((now - t.timerStartedAt) / 1000) : 0;
          return { ...t, timerRunning: false, timerStartedAt: null, timerSeconds: (t.timerSeconds || 0) + elapsed };
        }
        return t;
      });
      saveTasks(empName, updated);
      return { ...prev, [empName]: updated };

    const now = Date.now();

    if (myTasks && myTasks.some((t) => t.timerRunning)) {
      const stopped = myTasks.map((t) => {
        if (t.timerRunning) {
          const elapsed = t.timerStartedAt ? Math.floor((now - t.timerStartedAt) / 1000) : 0;
          return { ...t, timerRunning: false, timerStartedAt: null, timerSeconds: (t.timerSeconds || 0) + elapsed };
        }
        return t;
      });
      saveTasks(user.name, stopped);

    setToken(null); // effacer le JWT
    setUser(null); setAll({}); setAdmin(false);

        const merged = [...existing, ...newTasks];
        saveTasks(name, merged);
        next[name] = merged;

      return next;
    });
  }, []);

  const handlePrioritize = useCallback(async (ownerName) => {

        setAll((prev) => {

          const ordered = result.order.map((id) => tasks.find((t) => t.id === id)).filter(Boolean);

  const canSeeTeam = user.isChef || user.isAdmin || isDirectionUser;

  // Super Admin : inclus dans la liste pour voir son propre board (+ toute l'équipe)
  const pm = user.pole === "Direction"

    : (user.isAdmin || user.canViewAll || user.canViewKPI || user.canViewTJM)

      : empList.filter((e) => e.pole === user.pole && !e.isChef);

  // Membres Direction visibles en vue équipe
  const directionMembers = (user.isAdmin || user.pole === "Direction")

  const pmFiltered = teamPole === "all"       ? pm

    : teamPole === "elec"      ? pm.filter((m) => m.pole === "Élec")
    : teamPole === "com"       ? pm.filter((m) => m.pole === "Commercial")
    : teamPole === "direction" ? empList.filter((m) => m.pole === "Direction")
    : empList.filter((e) => e.isAdmin); // "admin" → Super Admins

  const fm = af === "all" ? pmFiltered : pmFiltered.filter((m) => {

  return (

      <style>{"*{box-sizing:border-box;margin:0;padding:0}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:" + BRD + ";border-radius:99px}select option{background:" + DARK + ";color:" + TXT + "}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}"}</style>

      {/* ═══════════════ SIDEBAR ═══════════════ */}
      <div style={{ background: DARK2, borderRight: "1px solid " + BRD, display: "flex", flexDirection: "column", height: "100vh", position: "sticky", top: 0, overflowY: "auto", zIndex: 100 }}>

      {prioritizeMsg && <PrioritizeToast name={prioritizeMsg.name} msg={prioritizeMsg.msg} onClose={() => setPrioritizeMsg(null)} />}
      {inactivityPaused && (
        <div style={{ position: "fixed", bottom: 20, left: "50%", transform: "translateX(-50%)", background: DARK2, border: "1px solid " + ORANGE + "66", borderLeft: "4px solid " + ORANGE, borderRadius: 12, padding: "12px 20px", zIndex: 4000, boxShadow: "0 8px 32px rgba(0,0,0,0.5)", display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 18 }}>⏸</span>
          <div>
            <div style={{ color: ORANGE, fontSize: 12, fontWeight: 700 }}>Timer mis en pause</div>
            <div style={{ color: TXT2, fontSize: 11 }}>Inactivité détectée depuis 5 minutes</div>
          </div>
        </div>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
